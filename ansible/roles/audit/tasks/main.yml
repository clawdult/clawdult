---
- name: Install auditd
  apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Configure auditd rules
  copy:
    content: |
      # Clawdult audit rules

      # Monitor /opt/clawdult for all access
      -w /opt/clawdult -p rwxa -k clawdult

      # Monitor secrets directory
      -w /opt/clawdult/secrets -p rwxa -k clawdult-secrets

      # Monitor config changes
      -w /opt/clawdult/config -p wa -k clawdult-config

      # Monitor SSH keys
      -w /home/ubuntu/.ssh -p rwxa -k ssh-keys

      # Monitor sudo usage
      -w /etc/sudoers -p wa -k sudoers
      -w /etc/sudoers.d -p wa -k sudoers

      # Monitor user/group changes
      -w /etc/passwd -p wa -k user-changes
      -w /etc/group -p wa -k group-changes

      # Monitor network configuration
      -w /etc/hosts -p wa -k network-config
      -w /etc/resolv.conf -p wa -k network-config

      # Log all commands executed by ubuntu user
      -a always,exit -F arch=b64 -F uid=1000 -S execve -k user-commands
    dest: /etc/audit/rules.d/clawdult.rules
    owner: root
    group: root
    mode: "0640"
  notify: Restart auditd

- name: Configure auditd
  lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^max_log_file =', line: 'max_log_file = 100' }
    - { regexp: '^num_logs =', line: 'num_logs = 10' }
    - { regexp: '^max_log_file_action =', line: 'max_log_file_action = rotate' }
  notify: Restart auditd

- name: Start auditd service
  systemd:
    name: auditd
    state: started
    enabled: yes

- name: Install CloudWatch agent
  block:
    - name: Download CloudWatch agent
      get_url:
        url: https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
        dest: /tmp/amazon-cloudwatch-agent.deb
        mode: "0644"

    - name: Install CloudWatch agent
      apt:
        deb: /tmp/amazon-cloudwatch-agent.deb

    - name: Configure CloudWatch agent
      copy:
        content: |
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/opt/clawdult/logs/agent/*.log",
                      "log_group_name": "/clawdult/{instance_id}/agent",
                      "log_stream_name": "{hostname}",
                      "retention_in_days": 30
                    },
                    {
                      "file_path": "/opt/clawdult/logs/audit/*.log",
                      "log_group_name": "/clawdult/{instance_id}/audit",
                      "log_stream_name": "{hostname}",
                      "retention_in_days": 90
                    },
                    {
                      "file_path": "/opt/clawdult/logs/cli/*.log",
                      "log_group_name": "/clawdult/{instance_id}/cli",
                      "log_stream_name": "{hostname}",
                      "retention_in_days": 30
                    },
                    {
                      "file_path": "/var/log/audit/audit.log",
                      "log_group_name": "/clawdult/{instance_id}/os-audit",
                      "log_stream_name": "{hostname}",
                      "retention_in_days": 90
                    }
                  ]
                }
              }
            },
            "metrics": {
              "namespace": "Clawdult",
              "metrics_collected": {
                "cpu": {
                  "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                  "metrics_collection_interval": 60
                },
                "disk": {
                  "measurement": ["used_percent"],
                  "metrics_collection_interval": 60,
                  "resources": ["/"]
                },
                "mem": {
                  "measurement": ["mem_used_percent"],
                  "metrics_collection_interval": 60
                }
              }
            }
          }
        dest: /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        owner: root
        group: root
        mode: "0644"

    - name: Cleanup CloudWatch agent installer
      file:
        path: /tmp/amazon-cloudwatch-agent.deb
        state: absent

    - name: Enable and start CloudWatch agent
      systemd:
        name: amazon-cloudwatch-agent
        state: started
        enabled: yes
